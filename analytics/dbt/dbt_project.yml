name: palpilot_analytics
version: "0.1.0"
config-version: 2
profile: palpilot

flags:
  send_anonymous_usage_stats: false

vars:
  session_gap_seconds: 300 # a gap longer than this between samples starts a new VM session
  sample_seconds: 60 # STATS_SAMPLE_SECONDS in panel/panel.py

models:
  palpilot_analytics:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
