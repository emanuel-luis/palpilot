<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palworld Coordinator</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel2:#1e252d; --border:#2a333d;
    --text:#e6edf3; --muted:#8b97a4; --accent:#4aa3ff; --accent2:#2b6fb3;
    --ok:#3fb950; --warn:#d29922; --danger:#f85149; --danger2:#b62324;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  [v-cloak]{display:none}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;
    background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:4px 10px;
    border-radius:999px;border:1px solid var(--border);background:var(--panel2)}
  .pill .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .pill.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .pill.busy .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .pill.off .dot{background:var(--danger)}
  header .meta{color:var(--muted);font-size:12px}
  header .spacer{flex:1}
  nav{display:flex;gap:4px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
  nav button{background:none;border:none;color:var(--muted);padding:12px 16px;cursor:pointer;
    font-size:14px;border-bottom:2px solid transparent}
  nav button.active{color:var(--text);border-bottom-color:var(--accent)}
  #banner{background:var(--panel2);border-bottom:1px solid var(--warn);padding:12px 20px;
    display:flex;align-items:center;gap:14px}
  main{max-width:980px;margin:0 auto;padding:20px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:7px;padding:8px 10px;font:inherit}
  textarea{font-family:var(--mono);font-size:12px;min-height:320px;resize:vertical;white-space:pre}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row.end{justify-content:flex-end}
  .btn{background:var(--accent2);border:1px solid var(--accent);color:#fff;padding:8px 14px;
    border-radius:7px;cursor:pointer;font:inherit}
  .btn:hover{background:var(--accent)}
  .btn.ghost{background:transparent;border-color:var(--border);color:var(--text)}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn.ok{background:#1f7a34;border-color:var(--ok)}
  .btn.ok:hover{background:var(--ok)}
  .btn.danger{background:var(--danger2);border-color:var(--danger)}
  .btn.danger:hover{background:var(--danger)}
  .btn:disabled{opacity:.5;cursor:default}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px}
  .kv .k{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:500}
  td .mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
  details.section{margin:0 0 10px;border:1px solid var(--border);border-radius:9px;background:var(--panel2);overflow:hidden}
  details.section>summary{list-style:none;margin:0;padding:12px 14px;color:var(--text);font-weight:600;
    display:flex;align-items:center;gap:10px;user-select:none;cursor:pointer}
  details.section>summary::-webkit-details-marker{display:none}
  details.section>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
  details.section[open]>summary::before{transform:rotate(90deg)}
  details.section>summary .count{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
  details.section .grid{padding:14px}
  .metric{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px}
  .metric .n{font-size:22px;font-weight:600}.metric .l{font-size:11px;color:var(--muted);text-transform:uppercase}
  .badge{font-size:11px;border:1px solid var(--border);border-radius:5px;padding:1px 6px;margin-right:4px;color:var(--muted)}
  .muted{color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--border);border-radius:8px;padding:10px 18px;max-width:90vw;transition:.25s}
  .toast.ok{border-color:var(--ok)}.toast.err{border-color:var(--danger)}
  .login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .login .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px;width:320px;max-width:92vw}
  .login h1{margin:0 0 4px;font-size:18px}.login p{margin:0 0 18px;color:var(--muted);font-size:13px}
  .login label{margin-top:12px}.login .btn{width:100%;margin-top:18px;justify-content:center;text-align:center}
  .err{color:var(--danger);font-size:12px;margin-top:10px;min-height:16px}
  .switch{display:flex;align-items:flex-start;gap:8px}
  .switch input{width:auto;margin-top:3px}
</style>
</head>
<body>
<div id="app" v-cloak>

  <!-- LOGIN -->
  <div class="login" v-if="!authed">
    <form class="box" @submit.prevent="login">
      <h1>Palworld Coordinator</h1>
      <p>Entre com as credenciais do painel.</p>
      <label>Usuário</label>
      <input v-model.trim="loginUser" autocomplete="username" autofocus>
      <label>Senha</label>
      <input v-model="loginPass" type="password" autocomplete="current-password">
      <button class="btn" type="submit">Entrar</button>
      <div class="err">{{ loginErr }}</div>
    </form>
  </div>

  <!-- APP -->
  <template v-if="authed">
    <header>
      <h1>{{ serverName }}</h1>
      <span class="meta" v-if="serverVersion">{{ serverVersion }}</span>
      <span class="pill" :class="vmPillClass"><span class="dot"></span>{{ vmLabel }}</span>
      <span class="spacer"></span>
      <button class="btn ok" v-if="can('power') && canStart" @click="startVm">▶ Ligar servidor</button>
      <button class="btn danger" v-if="can('power') && vm.status==='RUNNING'" @click="stopVm">■ Desligar</button>
      <button class="btn ghost" @click="refresh">↻</button>
      <button class="btn ghost" @click="logout">Sair</button>
    </header>

    <nav>
      <button v-for="t in visibleTabs" :key="t.id" :class="{active:tab===t.id}" @click="go(t.id)">{{ t.label }}</button>
    </nav>

    <div id="banner" v-if="vm.status && vm.status!=='RUNNING'">
      <template v-if="vmBusy">Servidor em transição ({{ vm.status }})… aguarde.</template>
      <template v-else>
        <span>🔌 Servidor desligado ({{ vm.status }}).</span>
        <button class="btn ok" v-if="can('power')" @click="startVm">▶ Ligar servidor</button>
        <span class="muted" v-else>(sem permissão para ligar)</span>
      </template>
    </div>

    <main>
      <!-- STATUS -->
      <section v-if="tab==='status'">
        <div class="card">
          <h2>Métricas</h2>
          <div class="grid" v-if="metricsCells.length"><div class="metric" v-for="c in metricsCells" :key="c.l">
            <div class="n">{{ c.v }}</div><div class="l">{{ c.l }}</div></div></div>
          <span class="muted" v-else>{{ vm.status==='RUNNING' ? 'servidor subindo…' : 'servidor desligado' }}</span>
        </div>
        <div class="card" v-if="server && server.info">
          <h2>Informações</h2>
          <div class="kv"><template v-for="(v,k) in server.info" :key="k"><span class="k">{{ k }}</span><span>{{ v }}</span></template></div>
        </div>
        <div class="card">
          <h2>Jogadores online ({{ players.length }})</h2>
          <table><thead><tr><th>Nome</th><th>Level</th><th>Ping</th><th>UserId</th></tr></thead>
          <tbody>
            <tr v-for="p in players" :key="p.userId||p.name"><td>{{ p.name }}</td><td>{{ p.level }}</td>
              <td>{{ p.ping!=null?Math.round(p.ping):'' }}</td><td class="mono">{{ p.userId }}</td></tr>
            <tr v-if="!players.length"><td colspan="4" class="muted">{{ vm.status==='RUNNING' ? 'Ninguém online' : '—' }}</td></tr>
          </tbody></table>
        </div>
      </section>

      <!-- CONFIG -->
      <section v-if="tab==='config'">
        <div class="card">
          <h2>Configurações do servidor</h2>
          <div v-if="vm.status!=='RUNNING'" class="muted">Ligue o servidor para editar as configurações.</div>
          <template v-else>
            <input v-model="cfgSearch" placeholder="Filtrar configurações…" style="margin-bottom:12px">
            <details class="section" v-for="g in cfgGroups" :key="g.title" open>
              <summary>{{ g.title }}<span class="count">{{ g.items.length }}</span></summary>
              <div class="grid">
                <template v-for="it in g.items" :key="it.key">
                  <label class="switch" v-if="it.type==='boolean'">
                    <input type="checkbox" v-model="it.value">
                    <span>{{ human(it.key) }}<br><span class="muted" style="font-size:10px">{{ it.key }}</span></span>
                  </label>
                  <div v-else>
                    <label>{{ human(it.key) }}<br><span class="muted" style="font-size:10px">{{ it.key }}</span></label>
                    <select v-if="enums[it.key]" v-model="it.value">
                      <option v-for="o in enums[it.key]" :key="o" :value="o">{{ o }}</option></select>
                    <input v-else-if="it.type==='number'" type="number" step="any" v-model.number="it.value">
                    <input v-else :type="secret(it.key)?'password':'text'" v-model="it.value">
                  </div>
                </template>
              </div>
            </details>
            <div class="row end" style="margin-top:14px">
              <label class="row" style="margin:0"><input type="checkbox" v-model="cfgRestart" style="width:auto"> reiniciar após salvar</label>
              <button class="btn ghost" @click="loadConfig">Recarregar</button>
              <button class="btn" @click="saveConfig">Salvar campos</button>
            </div>
            <details style="margin-top:12px">
              <summary class="muted" style="cursor:pointer">Editor bruto do PalWorldSettings.ini</summary>
              <textarea v-model="cfgRaw" spellcheck="false" style="margin-top:8px"></textarea>
              <div class="row end" style="margin-top:10px"><button class="btn" @click="saveRaw">Salvar arquivo bruto</button></div>
              <p class="muted">{{ cfgPath }}</p>
            </details>
          </template>
        </div>
      </section>

      <!-- COMMANDS -->
      <section v-if="tab==='commands'">
        <div class="card" v-if="vm.status!=='RUNNING'"><span class="muted">Servidor desligado.</span></div>
        <template v-else>
          <div class="card"><h2>Anúncio</h2>
            <div class="row"><input v-model="ann" placeholder="Mensagem para todos"><button class="btn" @click="cmd('announce',{message:ann})">Anunciar</button></div></div>
          <div class="card"><h2>Moderação</h2>
            <label>UserId</label><input v-model="modUser" placeholder="steam_0123456789">
            <label style="margin-top:8px">Mensagem</label><input v-model="modMsg" placeholder="Motivo">
            <div class="row" style="margin-top:10px">
              <button class="btn" @click="cmd('kick',{userid:modUser,message:modMsg})">Kick</button>
              <button class="btn danger" @click="cmd('ban',{userid:modUser,message:modMsg})">Ban</button>
              <button class="btn ghost" @click="cmd('unban',{userid:modUser})">Unban</button></div></div>
          <div class="card"><h2>Mundo</h2><div class="row"><button class="btn" @click="cmd('save',{})">Salvar mundo</button></div></div>
          <div class="card"><h2>Encerrar servidor Palworld</h2>
            <p class="muted">Encerra o jogo (a VM segue ligada). Para desligar a máquina use “Desligar” no topo.</p>
            <div class="row"><div><label>Espera (s)</label><input type="number" v-model.number="shWait" style="width:100px"></div>
              <div style="flex:1"><label>Mensagem</label><input v-model="shMsg" placeholder="Reiniciando…"></div></div>
            <div class="row" style="margin-top:10px">
              <button class="btn danger" @click="cmd('shutdown',{waittime:shWait,message:shMsg})">Shutdown</button>
              <button class="btn danger" @click="confirmStop">Force Stop</button></div></div>
        </template>
      </section>

      <!-- WATCHDOG -->
      <section v-if="tab==='watchdog'">
        <div class="card">
          <h2>Watchdog — desligamento automático</h2>
          <p class="muted">Desliga a VM depois de ficar vazia pelo tempo de tolerância. Vale imediatamente (sem recriar a VM).</p>
          <div class="grid">
            <div><label>Intervalo de checagem (segundos) — 10 a 3600</label>
              <input type="number" v-model.number="wd.poll_seconds" min="10" max="3600"></div>
            <div><label>Tolerância de ociosidade (minutos) — 1 a 1440</label>
              <input type="number" v-model.number="wdGraceMin" min="1" max="1440"></div>
          </div>
          <p class="muted">Grava: checa a cada {{ wd.poll_seconds }}s, desliga após {{ wdGraceMin }} min vazio.</p>
          <div class="row end"><button class="btn ghost" @click="loadWatchdog">Recarregar</button>
            <button class="btn" @click="saveWatchdog">Salvar</button></div>
        </div>
      </section>

      <!-- USERS -->
      <section v-if="tab==='users'">
        <div class="card">
          <h2>{{ userForm.editing ? 'Editar usuário: '+userForm.username : 'Adicionar usuário' }}</h2>
          <div class="grid">
            <div><label>Usuário</label><input v-model.trim="userForm.username" :readonly="userForm.editing"></div>
            <div><label>Senha {{ userForm.editing ? '(vazio = manter)' : '' }}</label><input type="password" v-model="userForm.password"></div>
          </div>
          <label style="margin-top:12px">Permissões</label>
          <div class="row" style="gap:16px">
            <label class="row" style="gap:6px;margin:0" v-for="p in allPerms" :key="p">
              <input type="checkbox" :value="p" v-model="userForm.perms" style="width:auto"> {{ permLabels[p]||p }}</label>
          </div>
          <div class="row end" style="margin-top:14px">
            <button class="btn ghost" @click="resetUserForm">Limpar</button>
            <button class="btn" @click="saveUser">Salvar usuário</button></div>
        </div>
        <div class="card">
          <h2>Usuários</h2>
          <table><thead><tr><th>Usuário</th><th>Permissões</th><th></th></tr></thead><tbody>
            <tr v-for="u in users" :key="u.username">
              <td>{{ u.username }}<span class="muted" v-if="u.username===me.user"> (você)</span></td>
              <td><span class="badge" v-for="p in u.perms" :key="p">{{ permLabels[p]||p }}</span></td>
              <td style="text-align:right;white-space:nowrap">
                <button class="btn ghost" @click="editUser(u)">Editar</button>
                <button class="btn danger" @click="delUser(u.username)" :disabled="u.username===me.user">Excluir</button></td></tr>
            <tr v-if="!users.length"><td colspan="3" class="muted">Nenhum usuário</td></tr>
          </tbody></table>
        </div>
      </section>
    </main>
  </template>

  <div class="toast" :class="toast.ok?'ok':'err'" v-if="toast.show">{{ toast.msg }}</div>
</div>

<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
<script>
const API=location.pathname.replace(/\/+$/,'');
const ENUMS={Difficulty:['None','Casual','Normal','Hard'],DeathPenalty:['None','Item','ItemAndEquipment','All'],LogFormatType:['Text','Json']};
const SECRET_KEYS=['AdminPassword','ServerPassword'];
const SERVER_KEYS=new Set(['ServerName','ServerDescription','ServerPlayerMaxNum','CoopPlayerMaxNum','PublicPort','PublicIP','Region','bUseAuth','BanListURL','bAllowClientMod','bShowPlayerList','ChatPostLimitPerMinute','bIsMultiplay','ServerPassword','AdminPassword','CrossplayPlatforms','LogFormatType','bIsShowJoinLeftMessage','ServerReplicatePawnCullDistance']);
const WORLD_KEYS=new Set(['Difficulty','RandomizerType','RandomizerSeed','bIsRandomizerPalLevelRandom','DayTimeSpeedRate','NightTimeSpeedRate','DeathPenalty','bHardcore','bPalLost','bCharacterRecreateInHardcore','autoSaveSpan','bIsUseBackupSaveData','SupplyDropSpan','EnablePredatorBossPal','bEnableInvaderEnemy','bActiveUNKO']);
const SECTIONS=[
  ['Servidor & Rede',k=>SERVER_KEYS.has(k)],
  ['API & RCON',k=>/^REST|^RCON/.test(k)],
  ['Voice Chat',k=>/VoiceChat/i.test(k)],
  ['PvP',k=>/pvp/i.test(k)||k==='bEnablePlayerToPlayerDamage'||k==='bEnableFriendlyFire'],
  ['Guild & Base',k=>/Guild|BaseCamp|Build|AutoTransferMaster/.test(k)],
  ['Pals',k=>/^Pal/.test(k)],
  ['Jogador',k=>/Player|Respawn|Enhance|FastTravel|AimAssist|StartLocation|ExistPlayerAfterLogout|NonLoginPenalty/.test(k)],
  ['Itens & Coleta',k=>/Item|Drop|Collection|Palbox|Technology/.test(k)],
  ['Mundo & Dificuldade',k=>WORLD_KEYS.has(k)],
  ['Taxas',k=>/Rate|Multiplier|Speed/.test(k)],
  ['Outros',k=>true],
];
const TABS=[
  {id:'status',label:'Status',perm:'view'},
  {id:'config',label:'Configurações',perm:'config'},
  {id:'commands',label:'Comandos',perm:'commands'},
  {id:'watchdog',label:'Watchdog',perm:'config'},
  {id:'users',label:'Usuários',perm:'users'},
];
const PERM_LABELS={view:'Ver status',power:'Ligar/Desligar',config:'Editar config',commands:'Comandos',users:'Gerenciar usuários'};

Vue.createApp({
  data(){return{
    auth:localStorage.getItem('pw_auth')||'', authed:false, me:{user:'',perms:[]},
    loginUser:'', loginPass:'', loginErr:'',
    tab:'status', vm:{status:'',ip:''}, server:null,
    cfgModel:[], cfgOrig:{}, cfgRaw:'', cfgPath:'', cfgSearch:'', cfgRestart:false,
    ann:'', modUser:'', modMsg:'', shWait:30, shMsg:'',
    wd:{poll_seconds:60,grace_seconds:1800},
    users:[], allPerms:['view','power','config','commands','users'],
    userForm:{username:'',password:'',perms:['view'],editing:false},
    permLabels:PERM_LABELS, enums:ENUMS,
    toast:{show:false,ok:true,msg:''}, _timer:null,
  }},
  computed:{
    visibleTabs(){return TABS.filter(t=>this.me.perms.includes(t.perm));},
    vmBusy(){return /STOP|STAG|PROV|REPAIR|SUSPEND/.test(this.vm.status);},
    canStart(){return this.vm.status && this.vm.status!=='RUNNING' && !this.vmBusy;},
    vmPillClass(){return this.vm.status==='RUNNING'?'on':(this.vmBusy?'busy':'off');},
    vmLabel(){return 'VM: '+(this.vm.status||'…');},
    serverName(){return this.server&&this.server.info&&this.server.info.servername||'Palworld';},
    serverVersion(){return this.server&&this.server.info&&this.server.info.version||'';},
    players(){return this.server&&this.server.players||[];},
    metricsCells(){
      const m=this.server&&this.server.metrics; if(!m)return[];
      const cells=[['FPS','serverfps'],['Jogadores','currentplayernum'],['Máx','maxplayernum'],
        ['Uptime (s)','uptime'],['Frametime','serverframetime'],['Dias','days']];
      return cells.filter(([l,k])=>m[k]!=null).map(([l,k])=>({l,v:m[k]}));
    },
    wdGraceMin:{get(){return Math.round(this.wd.grace_seconds/60);},set(v){this.wd.grace_seconds=Math.round(v*60);}},
    cfgGroups(){
      const q=this.cfgSearch.toLowerCase();
      const match=it=>!q||it.key.toLowerCase().includes(q)||this.human(it.key).toLowerCase().includes(q);
      const used=new Set(), groups=[];
      for(const [title,test] of SECTIONS){
        const items=this.cfgModel.filter(it=>!used.has(it.key)&&test(it.key));
        items.forEach(it=>used.add(it.key));
        const shown=items.filter(match);
        if(shown.length)groups.push({title,items:shown});
      }
      return groups;
    },
  },
  methods:{
    can(p){return this.me.perms.includes(p);},
    human(k){return k.replace(/^b(?=[A-Z])/,'').replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/_/g,' ').trim();},
    secret(k){return SECRET_KEYS.includes(k);},
    notify(msg,ok=true){this.toast={show:true,ok,msg};clearTimeout(this._t);this._t=setTimeout(()=>this.toast.show=false,2800);},
    async api(method,path,body){
      const opt={method,headers:{}};
      if(this.auth)opt.headers['Authorization']='Basic '+this.auth;
      if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
      const r=await fetch(API+path,opt);
      let data;try{data=await r.json();}catch{data={};}
      if(r.status===401)this.logout();
      return{ok:r.ok,status:r.status,data};
    },
    async login(){
      const token=btoa(this.loginUser+':'+this.loginPass);
      const r=await fetch(API+'/api/session',{headers:{Authorization:'Basic '+token}});
      if(r.ok){this.auth=token;localStorage.setItem('pw_auth',token);this.loginErr='';this.onAuth(await r.json());}
      else this.loginErr='Credenciais inválidas';
    },
    logout(){this.auth='';localStorage.removeItem('pw_auth');this.authed=false;clearInterval(this._timer);this._timer=null;},
    onAuth(d){
      this.me=d; this.authed=true;
      if(!this.visibleTabs.find(t=>t.id===this.tab))this.tab=(this.visibleTabs[0]||{id:'status'}).id;
      this.refresh();
      if(!this._timer)this._timer=setInterval(this.pollOverview,8000);
    },
    go(id){this.tab=id;if(id==='config')this.loadConfig();if(id==='users')this.loadUsers();if(id==='watchdog')this.loadWatchdog();},
    refresh(){this.pollOverview();if(this.tab==='config')this.loadConfig();},
    async pollOverview(){
      const r=await this.api('GET','/api/overview');
      if(r.ok){this.vm=r.data.vm||this.vm;this.server=r.data.server;}
    },
    async startVm(){const r=await this.api('POST','/api/vm/start',{});this.notify(r.ok?'Ligando… ~2-3min':'Falha ao ligar',r.ok);setTimeout(this.pollOverview,3000);},
    async stopVm(){if(!confirm('Desligar a VM? Jogadores caem.'))return;const r=await this.api('POST','/api/vm/stop',{});this.notify(r.ok?'Desligando…':'Falha',r.ok);setTimeout(this.pollOverview,3000);},
    confirmStop(){if(confirm('Forçar parada imediata do jogo?'))this.cmd('stop',{});},
    async cmd(ep,body){
      const r=await this.api('POST','/api/rest/'+ep,body);
      this.notify(r.ok?('OK: '+ep):('Falha ('+r.status+'): '+(r.data.error||'')),r.ok);
      if(['kick','ban','unban','shutdown','stop'].includes(ep))setTimeout(this.pollOverview,1200);
    },
    async loadConfig(){
      if(this.vm.status!=='RUNNING')return;
      const [set,cfg]=await Promise.all([this.api('GET','/api/rest/settings'),this.api('GET','/api/config')]);
      const eff=set.ok?set.data:{}; const ini=cfg.ok?(cfg.data.options||{}):{};
      this.cfgRaw=cfg.ok?(cfg.data.raw||''):''; this.cfgPath=cfg.ok?(cfg.data.path||''):'';
      if(!set.ok){this.cfgModel=[];this.notify('Servidor REST indisponível',false);return;}
      const model=[];
      for(const [k,v] of Object.entries(eff)){if(Array.isArray(v))continue;model.push({key:k,value:v,type:typeof v});}
      SECRET_KEYS.forEach(k=>{if(!model.find(m=>m.key===k))model.push({key:k,value:ini[k]??'',type:'string'});});
      this.cfgModel=model;
      this.cfgOrig=Object.fromEntries(model.map(m=>[m.key,m.value]));
    },
    async saveConfig(){
      const changed={};
      this.cfgModel.forEach(m=>{if(m.value!==this.cfgOrig[m.key])changed[m.key]=m.value;});
      const n=Object.keys(changed).length;
      if(!n){this.notify('Nada mudou');return;}
      const r=await this.api('POST','/api/config?restart='+this.cfgRestart,{options:changed});
      if(r.ok){this.notify('Salvo ('+n+')'+(this.cfgRestart?' + reiniciando':''));this.loadConfig();}else this.notify('Erro ao salvar',false);
    },
    async saveRaw(){const r=await this.api('POST','/api/config?restart='+this.cfgRestart,{raw:this.cfgRaw});this.notify(r.ok?'Salvo':'Erro',r.ok);},
    async loadWatchdog(){const r=await this.api('GET','/api/watchdog');if(r.ok)this.wd={poll_seconds:r.data.poll_seconds,grace_seconds:r.data.grace_seconds};},
    async saveWatchdog(){
      const r=await this.api('POST','/api/watchdog',{poll_seconds:this.wd.poll_seconds,grace_seconds:this.wd.grace_seconds});
      this.notify(r.ok?'Watchdog atualizado':('Falha: '+(r.data.error||r.status)),r.ok);
    },
    async loadUsers(){
      const r=await this.api('GET','/api/users');
      if(r.ok){this.users=r.data.users||[];this.allPerms=r.data.all_perms||this.allPerms;}
    },
    resetUserForm(){this.userForm={username:'',password:'',perms:['view'],editing:false};},
    editUser(u){this.userForm={username:u.username,password:'',perms:[...u.perms],editing:true};},
    async saveUser(){
      if(!this.userForm.username){this.notify('Informe o usuário',false);return;}
      const body={username:this.userForm.username,perms:this.userForm.perms};
      if(this.userForm.password)body.password=this.userForm.password;
      const r=await this.api('POST','/api/users',body);
      if(r.ok){this.notify('Usuário salvo');this.resetUserForm();this.loadUsers();}else this.notify('Falha: '+(r.data.error||r.status),false);
    },
    async delUser(username){
      if(!confirm('Excluir '+username+'?'))return;
      const r=await this.api('DELETE','/api/users/'+encodeURIComponent(username));
      if(r.ok){this.notify('Excluído');this.loadUsers();}else this.notify('Falha: '+(r.data.error||r.status),false);
    },
  },
  async mounted(){
    if(this.auth){
      const r=await fetch(API+'/api/session',{headers:{Authorization:'Basic '+this.auth}});
      if(r.ok){this.onAuth(await r.json());return;}
    }
    this.authed=false;
  },
}).mount('#app');
</script>
</body>
</html>
