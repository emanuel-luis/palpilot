<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palworld Coordinator</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c22; --panel2:#1e252d; --border:#2a333d;
    --text:#e6edf3; --muted:#8b97a4; --accent:#4aa3ff; --accent2:#2b6fb3;
    --ok:#3fb950; --warn:#d29922; --danger:#f85149; --danger2:#b62324;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  /* Light theme: auto (OS preference) + explicit override via header toggle (data-theme). Dark stays default. */
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f5f7f9; --panel:#ffffff; --panel2:#eef1f4; --border:#d7dce1;
      --text:#1b232c; --muted:#5b6672; --accent:#1a73c7; --accent2:#155a9e;
      --ok:#1f7a34; --warn:#946a06; --danger:#c62828; --danger2:#a31515;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1216; --panel:#171c22; --panel2:#1e252d; --border:#2a333d;
    --text:#e6edf3; --muted:#8b97a4; --accent:#4aa3ff; --accent2:#2b6fb3;
    --ok:#3fb950; --warn:#d29922; --danger:#f85149; --danger2:#b62324;
  }
  :root[data-theme="light"]{
    --bg:#f5f7f9; --panel:#ffffff; --panel2:#eef1f4; --border:#d7dce1;
    --text:#1b232c; --muted:#5b6672; --accent:#1a73c7; --accent2:#155a9e;
    --ok:#1f7a34; --warn:#946a06; --danger:#c62828; --danger2:#a31515;
  }
  *{box-sizing:border-box}
  [v-cloak]{display:none}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;
    background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:4px 10px;
    border-radius:999px;border:1px solid var(--border);background:var(--panel2)}
  .pill .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .pill.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .pill.busy .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .pill.off .dot{background:var(--danger)}
  header .meta{color:var(--muted);font-size:12px}
  header .spacer{flex:1}
  nav{display:flex;gap:4px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
  nav button{background:none;border:none;color:var(--muted);padding:12px 16px;cursor:pointer;
    font-size:14px;border-bottom:2px solid transparent}
  nav button.active{color:var(--text);border-bottom-color:var(--accent)}
  #banner{background:var(--panel2);border-bottom:1px solid var(--warn);padding:12px 20px;
    display:flex;align-items:center;gap:14px}
  #connBanner{background:var(--panel2);border-bottom:1px solid var(--danger);padding:10px 20px;
    display:flex;align-items:center;gap:10px;color:var(--danger)}
  main{max-width:980px;margin:0 auto;padding:20px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);
    color:var(--text);border-radius:7px;padding:8px 10px;font:inherit}
  textarea{font-family:var(--mono);font-size:12px;min-height:320px;resize:vertical;white-space:pre}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row.end{justify-content:flex-end}
  .btn{background:var(--accent2);border:1px solid var(--accent);color:#fff;padding:8px 14px;
    border-radius:7px;cursor:pointer;font:inherit}
  .btn:hover{background:var(--accent)}
  .btn.ghost{background:transparent;border-color:var(--border);color:var(--text)}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn.ok{background:#1f7a34;border-color:var(--ok)}
  .btn.ok:hover{background:var(--ok)}
  .btn.danger{background:var(--danger2);border-color:var(--danger)}
  .btn.danger:hover{background:var(--danger)}
  .btn.small{padding:5px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px}
  .kv .k{color:var(--muted)}
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:500}
  td .mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .mono{font-family:var(--mono)}
  details.section{margin:0 0 10px;border:1px solid var(--border);border-radius:9px;background:var(--panel2);overflow:hidden}
  details.section>summary{list-style:none;margin:0;padding:12px 14px;color:var(--text);font-weight:600;
    display:flex;align-items:center;gap:10px;user-select:none;cursor:pointer}
  details.section>summary::-webkit-details-marker{display:none}
  details.section>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
  details.section[open]>summary::before{transform:rotate(90deg)}
  details.section>summary .count{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
  details.section .grid{padding:14px}
  .backups-row td{background:var(--panel2);border-bottom:1px solid var(--border)}
  .metric{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px}
  .metric .n{font-size:22px;font-weight:600}.metric .l{font-size:11px;color:var(--muted);text-transform:uppercase}
  .badge{font-size:11px;border:1px solid var(--border);border-radius:5px;padding:1px 6px;margin-right:4px;color:var(--muted)}
  .muted{color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--border);border-radius:8px;padding:10px 18px;max-width:90vw;transition:.25s}
  .toast.ok{border-color:var(--ok)}.toast.err{border-color:var(--danger)}
  .login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .login .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px;width:320px;max-width:92vw}
  .login h1{margin:0 0 4px;font-size:18px}.login p{margin:0 0 18px;color:var(--muted);font-size:13px}
  .login label{margin-top:12px}.login .btn{width:100%;margin-top:18px;justify-content:center;text-align:center}
  .err{color:var(--danger);font-size:12px;margin-top:10px;min-height:16px}
  .switch{display:flex;align-items:flex-start;gap:8px}
  .switch input{width:auto;margin-top:3px}
  .icon-btn{background:transparent;border:1px solid var(--border);color:var(--text);width:34px;height:34px;
    border-radius:7px;cursor:pointer;font-size:15px;line-height:1}
  .icon-btn:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div id="app" v-cloak>

  <!-- LOGIN -->
  <div class="login" v-if="!authed">
    <form class="box" @submit.prevent="login">
      <h1>{{ S.appTitle }}</h1>
      <p>{{ S.loginSubtitle }}</p>
      <label for="loginUser">{{ S.loginUser }}</label>
      <input id="loginUser" v-model.trim="loginUser" autocomplete="username" autofocus>
      <label for="loginPass">{{ S.loginPass }}</label>
      <input id="loginPass" v-model="loginPass" type="password" autocomplete="current-password">
      <button class="btn" type="submit" :disabled="loginBusy">{{ S.loginSubmit }}</button>
      <div class="err" role="alert">{{ loginErr }}</div>
    </form>
  </div>

  <!-- APP -->
  <template v-if="authed">
    <header>
      <h1>{{ serverName }}</h1>
      <span class="meta" v-if="serverVersion">{{ serverVersion }}</span>
      <span class="pill" :class="vmPillClass"><span class="dot"></span>{{ vmLabel }}</span>
      <span class="spacer"></span>
      <button class="btn ok" v-if="can('power') && canStart" :disabled="busy" @click="startVm">▶ {{ S.startServer }}</button>
      <button class="btn danger" v-if="can('power') && vm.status==='RUNNING'" :disabled="busy" @click="stopVm">■ {{ S.stopServer }}</button>
      <button class="icon-btn" @click="refresh" :aria-label="S.refresh" :title="S.refresh">↻</button>
      <button class="icon-btn" @click="toggleTheme" :aria-label="themeToggleLabel" :title="themeToggleLabel">{{ theme==='light'?'🌙':'☀' }}</button>
      <button class="btn ghost" @click="logout()">{{ S.signOut }}</button>
    </header>

    <nav>
      <button v-for="t in visibleTabs" :key="t.id" :class="{active:tab===t.id}" @click="go(t.id)">{{ t.label }}</button>
    </nav>

    <div id="connBanner" v-if="staleBanner" role="status" aria-live="polite">
      <span>⚠ {{ S.staleData }}</span>
    </div>

    <div id="banner" v-if="vm.status && vm.status!=='RUNNING'">
      <template v-if="vmBusy">{{ S.vmTransitioning(vm.status) }}</template>
      <template v-else>
        <span>🔌 {{ S.vmOff(vm.status) }}</span>
        <button class="btn ok" v-if="can('power')" :disabled="busy" @click="startVm">▶ {{ S.startServer }}</button>
        <span class="muted" v-else>{{ S.noStartPermission }}</span>
      </template>
    </div>

    <main>
      <!-- STATUS -->
      <section v-if="tab==='status'">
        <div class="card">
          <h2>{{ S.metrics }}</h2>
          <div class="grid" v-if="metricsCells.length"><div class="metric" v-for="c in metricsCells" :key="c.l">
            <div class="n">{{ c.v }}</div><div class="l">{{ c.l }}</div></div></div>
          <span class="muted" v-else>{{ vm.status==='RUNNING' ? S.serverStarting : S.serverOff }}</span>
        </div>
        <div class="card" v-if="server && server.info">
          <h2>{{ S.information }}</h2>
          <div class="kv"><template v-for="(v,k) in server.info" :key="k"><span class="k">{{ k }}</span><span>{{ v }}</span></template></div>
        </div>
        <div class="card">
          <h2>{{ S.onlinePlayers(players.length) }}</h2>
          <div class="table-scroll">
          <table><thead><tr><th scope="col">{{ S.colName }}</th><th scope="col">{{ S.colLevel }}</th><th scope="col">{{ S.colPing }}</th><th scope="col">{{ S.colUserId }}</th></tr></thead>
          <tbody>
            <tr v-for="p in players" :key="p.userId||p.name"><td>{{ p.name }}</td><td>{{ p.level }}</td>
              <td>{{ p.ping!=null?Math.round(p.ping):'' }}</td><td class="mono">{{ p.userId }}</td></tr>
            <tr v-if="!players.length"><td colspan="4" class="muted">{{ vm.status==='RUNNING' ? S.noOnePlaying : '—' }}</td></tr>
          </tbody></table>
          </div>
        </div>
      </section>

      <!-- CONFIG -->
      <section v-if="tab==='config'">
        <div class="card">
          <h2>{{ S.serverSettings }}</h2>
          <div v-if="vm.status!=='RUNNING'" class="muted">{{ S.startToEditSettings }}</div>
          <template v-else>
            <label for="cfgSearch" class="sr-only">{{ S.filterSettings }}</label>
            <input id="cfgSearch" v-model="cfgSearch" :placeholder="S.filterSettings" style="margin-bottom:12px">
            <details class="section" v-for="g in cfgGroups" :key="g.title" open>
              <summary>{{ g.title }}<span class="count">{{ g.items.length }}</span></summary>
              <div class="grid">
                <template v-for="it in g.items" :key="it.key">
                  <label class="switch" v-if="it.type==='boolean'" :for="'cfg-'+it.key">
                    <input type="checkbox" v-model="it.value" :id="'cfg-'+it.key">
                    <span>{{ human(it.key) }}<br><span class="muted" style="font-size:10px">{{ it.key }}</span></span>
                  </label>
                  <div v-else>
                    <label :for="'cfg-'+it.key">{{ human(it.key) }}<br><span class="muted" style="font-size:10px">{{ it.key }}</span></label>
                    <select v-if="enums[it.key]" :id="'cfg-'+it.key" v-model="it.value">
                      <option v-for="o in enums[it.key]" :key="o" :value="o">{{ o }}</option></select>
                    <input v-else-if="it.type==='number'" :id="'cfg-'+it.key" type="number" step="any" v-model.number="it.value">
                    <input v-else :id="'cfg-'+it.key" :type="secret(it.key)?'password':'text'" v-model="it.value">
                  </div>
                </template>
              </div>
            </details>
            <div class="row end" style="margin-top:14px">
              <label class="row" style="margin:0" for="cfgRestart"><input type="checkbox" id="cfgRestart" v-model="cfgRestart" style="width:auto"> {{ S.restartAfterSaving }}</label>
              <button class="btn ghost" @click="loadConfig">{{ S.reload }}</button>
              <button class="btn" :disabled="busy" @click="saveConfig">{{ S.saveFields }}</button>
            </div>
            <details style="margin-top:12px">
              <summary class="muted" style="cursor:pointer">{{ S.rawIniEditor }}</summary>
              <label for="cfgRaw" class="sr-only">{{ S.rawIniEditor }}</label>
              <textarea id="cfgRaw" v-model="cfgRaw" spellcheck="false" style="margin-top:8px"></textarea>
              <div class="row end" style="margin-top:10px"><button class="btn" :disabled="busy" @click="saveRaw">{{ S.saveRawFile }}</button></div>
              <p class="muted">{{ cfgPath }}</p>
            </details>
          </template>
        </div>
      </section>

      <!-- SAVES -->
      <section v-if="tab==='saves'">
        <div class="card" v-if="vm.status!=='RUNNING'"><span class="muted">{{ S.startToManageSaves }}</span></div>
        <template v-else>
          <div class="card">
            <h2>{{ S.newSaveSlot }}</h2>
            <p class="muted">{{ S.newSaveSlotHint }}</p>
            <label for="newSlotName" class="sr-only">{{ S.slotName }}</label>
            <div class="row"><input id="newSlotName" v-model="newSlotName" :placeholder="S.slotNamePlaceholder">
              <button class="btn" :disabled="busy" @click="createSlot">{{ S.createSlot }}</button></div>
          </div>
          <div class="card">
            <h2>{{ S.saves(saves.slots.length) }}</h2>
            <p class="muted">{{ S.savesHint }}</p>
            <div class="table-scroll">
            <table><thead><tr><th scope="col">{{ S.colName }}</th><th scope="col">{{ S.colGuid }}</th><th scope="col">{{ S.colSize }}</th><th scope="col"><span class="sr-only">{{ S.colActions }}</span></th></tr></thead><tbody>
              <template v-for="s in saves.slots" :key="s.guid">
                <tr>
                  <td>{{ s.name }}<span class="badge" v-if="s.active" style="color:var(--ok);border-color:var(--ok);margin-left:6px">{{ S.badgeActive }}</span>
                    <span class="badge" v-if="s.empty">{{ S.badgeEmpty }}</span></td>
                  <td class="mono">{{ s.guid }}</td>
                  <td>{{ fmtSize(s.size) }}</td>
                  <td style="text-align:right;white-space:nowrap">
                    <button class="btn ok" v-if="!s.active" :disabled="busy" @click="activateSlot(s)">{{ S.activate }}</button>
                    <button class="btn ghost" :disabled="busy||s.empty" @click="backupSlot(s)">{{ S.backup }}</button>
                    <button class="btn ghost" :disabled="busy" @click="toggleBackups(s)">{{ backupsState(s.guid).open ? S.hideBackups : S.showBackups }}</button>
                    <button class="btn danger" :disabled="busy||s.active" @click="deleteSlot(s)">{{ S.delete }}</button></td></tr>
                <tr class="backups-row" v-if="backupsState(s.guid).open">
                  <td colspan="4">
                    <h3>{{ S.backupsFor(s.name) }}</h3>
                    <p class="muted" v-if="!backupsState(s.guid).loaded">{{ S.loadingBackups }}</p>
                    <p class="muted" v-else-if="!backupsState(s.guid).list.length">{{ S.noBackups }}</p>
                    <div class="table-scroll" v-else>
                      <table><thead><tr><th scope="col">{{ S.colFile }}</th><th scope="col">{{ S.colLocation }}</th>
                        <th scope="col">{{ S.colSize }}</th><th scope="col">{{ S.colCreated }}</th><th scope="col"><span class="sr-only">{{ S.colActions }}</span></th></tr></thead>
                      <tbody>
                        <tr v-for="b in backupsState(s.guid).list" :key="b.ref">
                          <td class="mono">{{ b.file }}</td><td>{{ b.location }}</td><td>{{ fmtSize(b.size) }}</td>
                          <td>{{ fmtDate(b.created) }}</td>
                          <td style="text-align:right;white-space:nowrap">
                            <button class="btn small" :disabled="busy" @click="restoreBackup(s,b,false)">{{ S.restore }}</button>
                            <button class="btn small ghost" :disabled="busy" @click="restoreBackup(s,b,true)">{{ S.restoreAsNew }}</button>
                          </td>
                        </tr>
                      </tbody></table>
                    </div>
                  </td>
                </tr>
              </template>
              <tr v-if="!saves.slots.length"><td colspan="4" class="muted">{{ S.noSavesFound }}</td></tr>
            </tbody></table>
            </div>
          </div>
        </template>
      </section>

      <!-- MODS -->
      <section v-if="tab==='mods'">
        <div class="card" v-if="vm.status!=='RUNNING'"><span class="muted">{{ S.startToManageMods }}</span></div>
        <template v-else>
          <div class="card">
            <h2>{{ S.installMod }}</h2>
            <p class="muted">{{ S.installModHint }}</p>
            <label for="modUrl">{{ S.byUrl }}</label>
            <div class="row"><input id="modUrl" v-model="modUrl" placeholder="https://…/mod.pak">
              <label for="modUrlName" class="sr-only">{{ S.modFileNameOptional }}</label>
              <input id="modUrlName" v-model="modUrlName" :placeholder="S.modFileNameOptional" style="max-width:200px">
              <button class="btn" :disabled="busy" @click="installModUrl">{{ S.download }}</button></div>
            <label for="modUploadInput" style="margin-top:12px">{{ S.byUpload }}</label>
            <div class="row"><input id="modUploadInput" type="file" accept=".pak" @change="pickModFile">
              <button class="btn" :disabled="busy" @click="uploadMod">{{ S.upload }}</button></div>
          </div>
          <div class="card">
            <h2>{{ S.installedMods(mods.mods.length) }}</h2>
            <div class="table-scroll">
            <table><thead><tr><th scope="col">{{ S.colFile }}</th><th scope="col">{{ S.colStatus }}</th>
              <th scope="col">{{ S.colSource }}</th><th scope="col">{{ S.colInstalledAt }}</th>
              <th scope="col">{{ S.colSize }}</th><th scope="col"><span class="sr-only">{{ S.colActions }}</span></th></tr></thead><tbody>
              <tr v-for="m in mods.mods" :key="m.name">
                <td class="mono">{{ m.name }}</td>
                <td><span class="badge" :style="m.enabled?'color:var(--ok);border-color:var(--ok)':''">{{ m.enabled ? S.enabled : S.disabled }}</span></td>
                <td class="mono" style="max-width:220px;overflow:hidden;text-overflow:ellipsis">{{ m.source_url || '—' }}</td>
                <td>{{ fmtDate(m.installed_at) || '—' }}</td>
                <td>{{ fmtSize(m.size) }}</td>
                <td style="text-align:right;white-space:nowrap">
                  <button class="btn ghost" :disabled="busy" @click="toggleMod(m)">{{ m.enabled ? S.disable : S.enable }}</button>
                  <button class="btn danger" :disabled="busy" @click="deleteMod(m)">{{ S.remove }}</button></td></tr>
              <tr v-if="!mods.mods.length"><td colspan="6" class="muted">{{ S.noMods }}</td></tr>
            </tbody></table>
            </div>
            <div class="row end" style="margin-top:12px"><button class="btn ghost" :disabled="busy" @click="restartServer">↻ {{ S.restartToApplyMods }}</button></div>
          </div>
        </template>
      </section>

      <!-- COMMANDS -->
      <section v-if="tab==='commands'">
        <div class="card" v-if="vm.status!=='RUNNING'"><span class="muted">{{ S.serverOff }}</span></div>
        <template v-else>
          <div class="card"><h2>{{ S.announcement }}</h2>
            <label for="annInput" class="sr-only">{{ S.announcementMessage }}</label>
            <div class="row"><input id="annInput" v-model="ann" :placeholder="S.announcementMessage"><button class="btn" :disabled="busy" @click="cmd('announce',{message:ann})">{{ S.announce }}</button></div></div>
          <div class="card"><h2>{{ S.moderation }}</h2>
            <label for="modUserInput">{{ S.userId }}</label><input id="modUserInput" v-model="modUser" placeholder="steam_0123456789">
            <label for="modMsgInput" style="margin-top:8px">{{ S.messageLabel }}</label><input id="modMsgInput" v-model="modMsg" :placeholder="S.reason">
            <div class="row" style="margin-top:10px">
              <button class="btn" :disabled="busy" @click="cmd('kick',{userid:modUser,message:modMsg})">{{ S.kick }}</button>
              <button class="btn danger" :disabled="busy" @click="cmd('ban',{userid:modUser,message:modMsg})">{{ S.ban }}</button>
              <button class="btn ghost" :disabled="busy" @click="cmd('unban',{userid:modUser})">{{ S.unban }}</button></div></div>
          <div class="card"><h2>{{ S.world }}</h2><div class="row"><button class="btn" :disabled="busy" @click="cmd('save',{})">{{ S.saveWorld }}</button></div></div>
          <div class="card"><h2>{{ S.shutdownPalworld }}</h2>
            <p class="muted">{{ S.shutdownHint }}</p>
            <div class="row"><div><label for="shWaitInput">{{ S.waitSeconds }}</label><input id="shWaitInput" type="number" v-model.number="shWait" style="width:100px"></div>
              <div style="flex:1"><label for="shMsgInput">{{ S.messageLabel }}</label><input id="shMsgInput" v-model="shMsg" :placeholder="S.restartingPlaceholder"></div></div>
            <div class="row" style="margin-top:10px">

              <input type="checkbox" :id="'perm-'+p" :value="p" v-model="userForm.perms" style="width:auto"> {{ permLabels[p]||p }}</label>
          </div>
          <div class="row end" style="margin-top:14px">
            <button class="btn ghost" @click="resetUserForm">{{ S.clear }}</button>
            <button class="btn" :disabled="busy" @click="saveUser">{{ S.saveUser }}</button></div>
        </div>
        <div class="card">
          <h2>{{ S.users }}</h2>
          <div class="table-scroll">
          <table><thead><tr><th scope="col">{{ S.username }}</th><th scope="col">{{ S.permissions }}</th><th scope="col"><span class="sr-only">{{ S.colActions }}</span></th></tr></thead><tbody>
            <tr v-for="u in users" :key="u.username">
              <td>{{ u.username }}<span class="muted" v-if="u.username===me.user"> {{ S.youSuffix }}</span></td>
              <td><span class="badge" v-for="p in u.perms" :key="p">{{ permLabels[p]||p }}</span></td>

                <button class="btn danger" :disabled="busy||u.username===me.user" @click="delUser(u.username)">{{ S.delete }}</button></td></tr>
            <tr v-if="!users.length"><td colspan="3" class="muted">{{ S.noUsers }}</td></tr>

          </div>
        </div>

    </main>
  </template>

  <div class="toast" :class="toast.ok?'ok':'err'" v-if="toast.show" role="status" :aria-live="toast.ok?'polite':'assertive'">{{ toast.msg }}</div>
</div>

const API=location.pathname.replace(/\/+$/,'');
const ENUMS={Difficulty:['None','Casual','Normal','Hard'],DeathPenalty:['None','Item','ItemAndEquipment','All'],LogFormatType:['Text','Json']};
const SECRET_KEYS=['AdminPassword','ServerPassword'];
const SERVER_KEYS=new Set(['ServerName','ServerDescription','ServerPlayerMaxNum','CoopPlayerMaxNum','PublicPort','PublicIP','Region','bUseAuth','BanListURL','bAllowClientMod','bShowPlayerList','ChatPostLimitPerMinute','bIsMultiplay','ServerPassword','AdminPassword','CrossplayPlatforms','LogFormatType','bIsShowJoinLeftMessage','ServerReplicatePawnCullDistance']);
const WORLD_KEYS=new Set(['Difficulty','RandomizerType','RandomizerSeed','bIsRandomizerPalLevelRandom','DayTimeSpeedRate','NightTimeSpeedRate','DeathPenalty','bHardcore','bPalLost','bCharacterRecreateInHardcore','autoSaveSpan','bIsUseBackupSaveData','SupplyDropSpan','EnablePredatorBossPal','bEnableInvaderEnemy','bActiveUNKO']);
const SECTIONS=[
  [STRINGS.secServerNet,k=>SERVER_KEYS.has(k)],
  [STRINGS.secApiRcon,k=>/^REST|^RCON/.test(k)],
  [STRINGS.secVoice,k=>/VoiceChat/i.test(k)],
  [STRINGS.secPvp,k=>/pvp/i.test(k)||k==='bEnablePlayerToPlayerDamage'||k==='bEnableFriendlyFire'],
  [STRINGS.secGuildBase,k=>/Guild|BaseCamp|Build|AutoTransferMaster/.test(k)],
  [STRINGS.secPals,k=>/^Pal/.test(k)],
  [STRINGS.secPlayer,k=>/Player|Respawn|Enhance|FastTravel|AimAssist|StartLocation|ExistPlayerAfterLogout|NonLoginPenalty/.test(k)],
  [STRINGS.secItems,k=>/Item|Drop|Collection|Palbox|Technology/.test(k)],
  [STRINGS.secWorldDiff,k=>WORLD_KEYS.has(k)],
  [STRINGS.secRates,k=>/Rate|Multiplier|Speed/.test(k)],
  [STRINGS.secOther,k=>true],
];
const TABS=[
  {id:'status',label:STRINGS.tabStatus,perm:'view'},
  {id:'config',label:STRINGS.tabConfig,perm:'config'},
  {id:'saves',label:STRINGS.tabSaves,perm:'config'},
  {id:'mods',label:STRINGS.tabMods,perm:'config'},
  {id:'commands',label:STRINGS.tabCommands,perm:'commands'},
  {id:'watchdog',label:STRINGS.tabWatchdog,perm:'config'},
  {id:'users',label:STRINGS.tabUsers,perm:'users'},
];
const PERM_LABELS={view:STRINGS.permView,power:STRINGS.permPower,config:STRINGS.permConfig,commands:STRINGS.permCommands,users:STRINGS.permUsers};

Vue.createApp({
  data(){return{
    S:STRINGS,
    auth:localStorage.getItem('pw_auth')||'', authed:false, me:{user:'',perms:[]},
    loginUser:'', loginPass:'', loginErr:'', loginBusy:false,
    tab:'status', vm:{status:'',ip:''}, server:null,
    cfgModel:[], cfgOrig:{}, cfgRaw:'', cfgPath:'', cfgSearch:'', cfgRestart:false,
    ann:'', modUser:'', modMsg:'', shWait:30, shMsg:'',
    wd:{poll_seconds:60,grace_seconds:1800},
    saves:{active:'',slots:[]}, newSlotName:'', backups:{},
    mods:{dir:'',mods:[]}, modUrl:'', modUrlName:'', modFile:null,
    users:[], allPerms:['view','power','config','commands','users'],
    userForm:{username:'',password:'',perms:['view'],editing:false},
    permLabels:PERM_LABELS, enums:ENUMS,
    toast:{show:false,ok:true,msg:''}, _timer:null, _t:null,
    pending:0, pollFails:0, staleBanner:false,
    theme:localStorage.getItem('pw_theme')||'',
  }},
  computed:{
    visibleTabs(){return TABS.filter(t=>this.me.perms.includes(t.perm));},
    vmBusy(){return /STOP|STAG|PROV|REPAIR|SUSPEND/.test(this.vm.status);},
    canStart(){return this.vm.status && this.vm.status!=='RUNNING' && !this.vmBusy;},
    vmPillClass(){return this.vm.status==='RUNNING'?'on':(this.vmBusy?'busy':'off');},
    vmLabel(){return 'VM: '+(this.vm.status||'…');},
    serverName(){return this.server&&this.server.info&&this.server.info.servername||'Palworld';},
    serverVersion(){return this.server&&this.server.info&&this.server.info.version||'';},
    players(){return this.server&&this.server.players||[];},
    busy(){return this.pending>0;},
    themeToggleLabel(){return this.theme==='light'?'Switch to dark theme':'Switch to light theme';},
    metricsCells(){
      const m=this.server&&this.server.metrics; if(!m)return[];
      const cells=[[STRINGS.metricFps,'serverfps'],[STRINGS.metricPlayers,'currentplayernum'],[STRINGS.metricMax,'maxplayernum'],
        [STRINGS.metricUptime,'uptime'],[STRINGS.metricFrametime,'serverframetime'],[STRINGS.metricDays,'days']];
      return cells.filter(([l,k])=>m[k]!=null).map(([l,k])=>({l,v:m[k]}));
    },
    wdGraceMin:{get(){return Math.round(this.wd.grace_seconds/60);},set(v){this.wd.grace_seconds=Math.round(v*60);}},
    cfgGroups(){
      const q=this.cfgSearch.toLowerCase();
      const match=it=>!q||it.key.toLowerCase().includes(q)||this.human(it.key).toLowerCase().includes(q);
      const used=new Set(), groups=[];
      for(const [title,test] of SECTIONS){
        const items=this.cfgModel.filter(it=>!used.has(it.key)&&test(it.key));
        items.forEach(it=>used.add(it.key));
        const shown=items.filter(match);
        if(shown.length)groups.push({title,items:shown});
      }
      return groups;
    },
  },
  methods:{
    can(p){return this.me.perms.includes(p);},
    human(k){return k.replace(/^b(?=[A-Z])/,'').replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/_/g,' ').trim();},
    secret(k){return SECRET_KEYS.includes(k);},
    notify(msg,ok=true){this.toast={show:true,ok,msg};clearTimeout(this._t);this._t=setTimeout(()=>this.toast.show=false,2800);},
    // Shared request helper: single error-envelope handling point ({ok,error,...data}),
    // and the single "pending" counter that drives every mutating button's disabled state.
    // Background polling passes {trackBusy:false} so it never blocks the UI.
    async api(method,path,body,opts){
      opts=opts||{};
      const track=opts.trackBusy!==false;
      if(track)this.pending++;
      try{
        const o={method,headers:{}};
        if(this.auth)o.headers['Authorization']='Basic '+this.auth;
        if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
        const r=await fetch(API+path,o);
        let data;try{data=await r.json();}catch{data={};}
        if(r.status===401)this.logout(STRINGS.sessionExpired);

      }catch(e){
        return{ok:false,status:0,data:{error:STRINGS.networkError}};

        if(track)this.pending--;
      }
    },
    async login(){
      this.loginBusy=true;
      try{
        const token=btoa(this.loginUser+':'+this.loginPass);
        const r=await fetch(API+'/api/session',{headers:{Authorization:'Basic '+token}});
        if(r.ok){this.auth=token;localStorage.setItem('pw_auth',token);this.loginErr='';this.onAuth(await r.json());}
        else this.loginErr=STRINGS.loginInvalid;
      }catch(e){this.loginErr=STRINGS.networkError;}
      finally{this.loginBusy=false;}
    },
    logout(reason){this.auth='';localStorage.removeItem('pw_auth');this.authed=false;clearInterval(this._timer);this._timer=null;this.loginErr=reason||'';},
    onAuth(d){
      this.me=d; this.authed=true;
      if(!this.visibleTabs.find(t=>t.id===this.tab))this.tab=(this.visibleTabs[0]||{id:'status'}).id;

      if(!this._timer)this._timer=setInterval(this.pollOverview,8000);
    },
    go(id){this.tab=id;if(id==='config')this.loadConfig();if(id==='users')this.loadUsers();if(id==='watchdog')this.loadWatchdog();if(id==='saves')this.loadSaves();if(id==='mods')this.loadMods();},
    fmtSize(b){if(b==null)return'';const u=['B','KB','MB','GB'];let i=0,n=b;while(n>=1024&&i<u.length-1){n/=1024;i++;}return n.toFixed(i?1:0)+' '+u[i];},
    fmtDate(v){
      if(v==null||v==='')return'';
      let d;
      if(typeof v==='number')d=new Date(v>1e12?v:v*1000);
      else d=new Date(v);
      return isNaN(d.getTime())?String(v):d.toLocaleString();
    },
    toggleTheme(){
      this.theme=this.theme==='light'?'dark':'light';
      document.documentElement.setAttribute('data-theme',this.theme);
      localStorage.setItem('pw_theme',this.theme);
    },
    refresh(){this.pollOverview();if(this.tab==='config')this.loadConfig();},
    async pollOverview(){
      const r=await this.api('GET','/api/overview',undefined,{trackBusy:false});
      if(r.ok){
        this.vm=r.data.vm||this.vm;this.server=r.data.server;
        this.pollFails=0;this.staleBanner=false;
      }else if(r.status!==401){
        this.pollFails++;
        if(this.pollFails>=2)this.staleBanner=true;
      }
    },
    async startVm(){const r=await this.api('POST','/api/vm/start',{});this.notify(r.ok?STRINGS.vmStarting:STRINGS.vmStartFailed,r.ok);setTimeout(this.pollOverview,3000);},
    async stopVm(){if(!confirm(STRINGS.confirmStopVm))return;const r=await this.api('POST','/api/vm/stop',{});this.notify(r.ok?STRINGS.vmStopping:STRINGS.vmStopFailed,r.ok);setTimeout(this.pollOverview,3000);},
    confirmStop(){if(confirm(STRINGS.confirmForceStop))this.cmd('stop',{});},
    async cmd(ep,body){
      const r=await this.api('POST','/api/rest/'+ep,body);
      this.notify(r.ok?STRINGS.cmdOk(ep):STRINGS.cmdFailed(r.status,r.data.error),r.ok);
      if(['kick','ban','unban','shutdown','stop'].includes(ep))setTimeout(this.pollOverview,1200);
    },
    async loadConfig(){
      if(this.vm.status!=='RUNNING')return;
      const [set,cfg]=await Promise.all([this.api('GET','/api/rest/settings'),this.api('GET','/api/config')]);
      const eff=set.ok?set.data:{}; const ini=cfg.ok?(cfg.data.options||{}):{};
      this.cfgRaw=cfg.ok?(cfg.data.raw||''):''; this.cfgPath=cfg.ok?(cfg.data.path||''):'';

      const model=[];
      for(const [k,v] of Object.entries(eff)){if(Array.isArray(v))continue;model.push({key:k,value:v,type:typeof v});}
      SECRET_KEYS.forEach(k=>{if(!model.find(m=>m.key===k))model.push({key:k,value:ini[k]??'',type:'string'});});

      this.cfgOrig=Object.fromEntries(model.map(m=>[m.key,m.value]));
    },
    async saveConfig(){

      if(!n){this.notify(STRINGS.nothingChanged);return;}
      const r=await this.api('POST','/api/config?restart='+this.cfgRestart,{options:changed});

    },
    async saveRaw(){const r=await this.api('POST','/api/config?restart='+this.cfgRestart,{raw:this.cfgRaw});this.notify(r.ok?STRINGS.savedGeneric:(r.data.error||STRINGS.errorGeneric),r.ok);},
    async loadWatchdog(){const r=await this.api('GET','/api/watchdog');if(r.ok)this.wd={poll_seconds:r.data.poll_seconds,grace_seconds:r.data.grace_seconds};},
    async saveWatchdog(){
      const r=await this.api('POST','/api/watchdog',{poll_seconds:this.wd.poll_seconds,grace_seconds:this.wd.grace_seconds});
      this.notify(r.ok?STRINGS.watchdogUpdated:STRINGS.failed(r.data.error||r.status),r.ok);
    },
    // ---- save slots ----
    async loadSaves(){
      if(this.vm.status!=='RUNNING'){this.saves={active:'',slots:[]};return;}
      const r=await this.api('GET','/api/saves');
      if(r.ok){
        this.saves=r.data;
        (r.data.slots||[]).forEach(s=>{if(!this.backups[s.guid])this.backups[s.guid]={open:false,loaded:false,list:[]};});
      }else this.notify(r.data.error||STRINGS.savesListFailed,false);
    },
    async createSlot(){
      const name=this.newSlotName.trim();
      if(!name){this.notify(STRINGS.enterName,false);return;}
      const r=await this.api('POST','/api/saves',{name});
      if(r.ok){this.notify(STRINGS.slotCreated(r.data.name));this.newSlotName='';this.loadSaves();}
      else this.notify(STRINGS.failed(r.data.error||r.status),false);
    },
    async activateSlot(s){
      if(!confirm(STRINGS.confirmActivate(s.name)))return;
      this.notify(STRINGS.activating);
      const r=await this.api('POST','/api/saves/'+encodeURIComponent(s.guid)+'/activate?restart=true',{});
      if(r.ok){this.notify(STRINGS.worldActive(s.name,r.data.restarted));setTimeout(this.loadSaves,2000);}
      else this.notify(STRINGS.failed(r.data.error||r.status),false);
    },
    async backupSlot(s){
      const r=await this.api('POST','/api/saves/'+encodeURIComponent(s.guid)+'/backup',{});
      if(r.ok)this.notify(STRINGS.backupDone(r.data.remote||r.data.local||r.data.file));
      else this.notify(STRINGS.failed(r.data.error||r.status),false);
    },
    async deleteSlot(s){
      if(!confirm(STRINGS.confirmDeleteSlot(s.name)))return;
      const r=await this.api('DELETE','/api/saves/'+encodeURIComponent(s.guid));
      if(r.ok){this.notify(STRINGS.slotDeleted);this.loadSaves();}
      else this.notify(STRINGS.failed(r.data.error||r.status),false);
    },
    // ---- backups / restore ----
    // Pure read for template use — never mutates state during render.
    // Entries are seeded in loadSaves()/ensured in toggleBackups() instead.
    backupsState(guid){
      return this.backups[guid]||{open:false,loaded:false,list:[]};
    },
    _ensureBackupsEntry(guid){
      if(!this.backups[guid])this.backups[guid]={open:false,loaded:false,list:[]};
      return this.backups[guid];
    },
    async toggleBackups(s){
      const st=this._ensureBackupsEntry(s.guid);
      st.open=!st.open;
      if(st.open&&!st.loaded)await this.loadBackups(s);
    },
    async loadBackups(s){
      const st=this._ensureBackupsEntry(s.guid);
      const r=await this.api('GET','/api/saves/'+encodeURIComponent(s.guid)+'/backups');
      if(r.ok){st.list=r.data.backups||[];st.loaded=true;}
      else this.notify(STRINGS.failed(r.data.error||r.status),false);
    },
    async restoreBackup(s,b,asNew){
      let name='';
      if(asNew){
        name=(prompt(STRINGS.promptNewSlotName,s.name+' (restored)')||'').trim();
        if(!name)return;
      }
      const msg=asNew?STRINGS.confirmRestoreAsNew(b.file,name):STRINGS.confirmRestore(b.file,s.name);
      if(!confirm(msg))return;
      const body={ref:b.ref};
      if(asNew){body.as_new_slot=true;body.name=name;}
      const r=await this.api('POST','/api/saves/'+encodeURIComponent(s.guid)+'/restore',body);
      if(r.ok){
        this.notify(STRINGS.restoreDone(asNew?name:s.name));
        this._ensureBackupsEntry(s.guid).open=false;
        this.loadSaves();
      }else this.notify(STRINGS.failed(r.data.error||r.status),false);
    },
    // ---- mods ----
    async loadMods(){
      if(this.vm.status!=='RUNNING'){this.mods={dir:'',mods:[]};return;}
      const r=await this.api('GET','/api/mods');
      if(r.ok)this.mods=r.data;else this.notify(r.data.error||STRINGS.modsListFailed,false);
    },
    async installModUrl(){
      const url=this.modUrl.trim();
      if(!url){this.notify(STRINGS.enterModUrl,false);return;}
      const r=await this.api('POST','/api/mods/url?restart=false',{url,name:this.modUrlName.trim()});
      if(r.ok){this.notify(STRINGS.modInstalled(r.data.name));this.modUrl='';this.modUrlName='';this.loadMods();}
      else this.notify(STRINGS.failed(r.data.error||r.status),false);
    },
    pickModFile(e){this.modFile=e.target.files[0]||null;},
    async uploadMod(){
      const f=this.modFile;
      if(!f){this.notify(STRINGS.chooseModFile,false);return;}
      if(!f.name.toLowerCase().endsWith('.pak')){this.notify(STRINGS.onlyPakFiles,false);return;}
      this.pending++;
      let data,ok,status;
      try{
        const r=await fetch(API+'/api/mods/upload?name='+encodeURIComponent(f.name)+'&restart=false',
          {method:'POST',headers:{Authorization:'Basic '+this.auth,'Content-Type':'application/octet-stream'},body:f});
        try{data=await r.json();}catch{data={};}
        ok=r.ok;status=r.status;
      }catch(e){ok=false;status=0;data={error:STRINGS.networkError};}
      finally{this.pending--;}
      if(ok){this.notify(STRINGS.modUploaded(data.name));this.modFile=null;this.loadMods();}
      else this.notify(STRINGS.uploadFailed(status,data.error),false);
    },
    async toggleMod(m){
      const ep=m.enabled?'disable':'enable';
      const r=await this.api('POST','/api/mods/'+encodeURIComponent(m.name)+'/'+ep,{});
      if(r.ok){this.notify(m.enabled?STRINGS.modDisabled:STRINGS.modEnabled);this.loadMods();}
      else this.notify(STRINGS.failed(r.data.error||r.status),false);
    },
    async deleteMod(m){
      if(!confirm(STRINGS.confirmDeleteMod(m.name)))return;
      const r=await this.api('DELETE','/api/mods/'+encodeURIComponent(m.name));
      if(r.ok){this.notify(STRINGS.modRemoved);this.loadMods();}
      else this.notify(STRINGS.failed(r.data.error||r.status),false);
    },
    async restartServer(){
      if(!confirm(STRINGS.confirmRestartServer))return;
      const r=await this.api('POST','/api/restart',{});
      this.notify(r.ok?STRINGS.restarting:STRINGS.restartFailed,r.ok);
    },
    async loadUsers(){
      const r=await this.api('GET','/api/users');
      if(r.ok){this.users=r.data.users||[];this.allPerms=r.data.all_perms||this.allPerms;}
    },
    resetUserForm(){this.userForm={username:'',password:'',perms:['view'],editing:false};},
    editUser(u){this.userForm={username:u.username,password:'',perms:[...u.perms],editing:true};},
    async saveUser(){
      if(!this.userForm.username){this.notify(STRINGS.enterUsername,false);return;}
      const body={username:this.userForm.username,perms:this.userForm.perms};
      if(this.userForm.password)body.password=this.userForm.password;
      const r=await this.api('POST','/api/users',body);
      if(r.ok){this.notify(STRINGS.userSaved);this.resetUserForm();this.loadUsers();}else this.notify(STRINGS.failed(r.data.error||r.status),false);
    },
    async delUser(username){
      if(!confirm(STRINGS.confirmDeleteUser(username)))return;
      const r=await this.api('DELETE','/api/users/'+encodeURIComponent(username));
      if(r.ok){this.notify(STRINGS.userDeleted);this.loadUsers();}else this.notify(STRINGS.failed(r.data.error||r.status),false);
    },
  },
  async mounted(){
    if(this.theme)document.documentElement.setAttribute('data-theme',this.theme);
    if(this.auth){
      try{
        const r=await fetch(API+'/api/session',{headers:{Authorization:'Basic '+this.auth}});
        if(r.ok){this.onAuth(await r.json());return;}
      }catch(e){/* fall through to login screen */}
    }
    this.authed=false;
  },
}).mount('#app');
</script>
</body>
</html>
