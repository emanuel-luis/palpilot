version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint 8 supports TypeScript up to 6.0 (docs/DECISIONS.md row 41).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /coordinator
    ignore:
      # The runtime stays on Python 3.12 (refactor baseline); only patch and digest updates of that tag.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    schedule:
      interval: weekly
