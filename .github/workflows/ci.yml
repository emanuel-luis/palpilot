name: ci

# Checks for every change. Pull requests run it directly; pushes to main that touch
# coordinator/, frontend/ or panel/ get it through deploy.yml (workflow_call), so
# the deploy only starts after it passes. No workflow-level concurrency: this file
# is also called from deploy.yml.

on:
  pull_request: {}
  push:
    branches: [main]
    paths-ignore:
      - "coordinator/**"
      - "frontend/**"
      - "panel/**"
  workflow_dispatch: {}
  workflow_call: {}
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # Fails only on findings that are not in .checkov.baseline.
      - name: checkov
        run: uvx --from checkov==3.3.30 checkov -d . --framework terraform --compact --quiet --baseline .checkov.baseline

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 (LTS) in ci.yml, deploy.yml and security.yml; Vitest 5 needs 22.12 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build (runs tsc -b, then vite build into coordinator/)
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-build
          path: |
            coordinator/index.html
            coordinator/assets/
          retention-days: 1
          if-no-files-found: error

  test-python:
    needs: [lint-python, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The route tests serve the built console; use this run's build, not the committed one.
      - run: rm -rf coordinator/assets coordinator/index.html
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console-build
          path: coordinator
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  container:
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console-build
          path: coordinator
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: requirements.lock is up to date
        run: |
          uv pip compile coordinator/requirements.txt --python-version 3.12 --python-platform x86_64-manylinux_2_28 --generate-hashes -o coordinator/requirements.lock
          git diff --exit-code -- coordinator/requirements.lock || { echo "Stale lock: run 'make lock' and commit it"; exit 1; }
      - name: Build image
        run: docker build -t palpilot-coordinator:ci coordinator
      - name: Container runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id palpilot-coordinator:ci -u)
          test "$uid" != "0" || { echo "container runs as root"; exit 1; }
      - name: Smoke
        run: |
          # main.py builds GCP clients at import, so it needs credentials that exist
          # but are fake: nothing here reaches GCP.
          printf '{"type":"authorized_user","client_id":"ci","client_secret":"ci","refresh_token":"ci"}' > "$RUNNER_TEMP/adc.json"
          chmod 644 "$RUNNER_TEMP/adc.json"
          docker run -d --name palpilot-ci -p 8080:8080 \
            -v "$RUNNER_TEMP/adc.json:/adc.json:ro" \
            -e GOOGLE_APPLICATION_CREDENTIALS=/adc.json -e GOOGLE_CLOUD_PROJECT=ci \
            -e PROJECT_ID=ci -e VM_ZONE=ci-a -e VM_INSTANCE=ci \
            palpilot-coordinator:ci
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && break
            sleep 1
          done
          code=$(curl -sS -o /tmp/index.html -w '%{http_code}' http://127.0.0.1:8080/)
          test "$code" = 200 || { echo "GET / returned $code"; exit 1; }
          asset=$(grep -oE '/assets/[A-Za-z0-9._-]+\.js' /tmp/index.html | head -1)
          test -n "$asset" || { echo "index.html references no /assets/*.js"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$asset")
          test "$code" = 200 || { echo "$asset returned $code"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/overview)
          test "$code" = 401 || { echo "/api/overview returned $code, expected 401"; exit 1; }
          echo "console + assets served, API gated"
      - name: Container logs
        if: always()
        run: docker logs palpilot-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f palpilot-ci || true
