name: deploy

# Auto-deploy on push to main. Mirrors the safe manual flow and NEVER touches
# the VM (no terraform / no VM recreate): it only redeploys the always-on
# coordinator (Cloud Run) and pushes panel code to the GCS bucket.
#
# PAUSED: the GCP project is offline by choice (billing disabled). Both deploy
# jobs run only when the repository variable DEPLOY_ENABLED is 'true'; otherwise
# they are skipped (not failed) and only the CI checks run. To revive, follow
# docs/REVIVAL.md, then set DEPLOY_ENABLED=true in the repo's Actions variables.
#
# - frontend/** or coordinator/**  -> build the single-file UI + redeploy the coordinator
# - panel/**                       -> push panel code to the bucket (applied on next VM boot)
#
# One-time setup (Workload Identity Federation + repo secrets/vars): see docs/CICD.md.
# Note: .github/** intentionally NOT a trigger path, so adding/editing this file
# doesn't fire a deploy; use the "Run workflow" button (workflow_dispatch) to test.

on:
  push:
    branches: [main]
    paths:
      - "coordinator/**"
      - "frontend/**"
      - "panel/**"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for keyless Workload Identity Federation auth

env:
  PROJECT: ${{ vars.GCP_PROJECT }}
  REGION: ${{ vars.GCP_REGION }}
  PANEL_BUCKET: ${{ vars.PANEL_BUCKET }}

jobs:
  # Same checks as pull requests; both deploy jobs wait for them.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      coordinator: ${{ steps.f.outputs.coordinator }}
      frontend: ${{ steps.f.outputs.frontend }}
      panel: ${{ steps.f.outputs.panel }}
    steps:
      # Credentials stay persisted here on purpose: on push events paths-filter runs
      # `git fetch origin <before-sha>`, which needs them in this private repo. The
      # token is contents:read only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            coordinator: ['coordinator/**']
            frontend: ['frontend/**']
            panel: ['panel/**']

  deploy-coordinator:
    timeout-minutes: 30
    needs: [changes, ci]
    if: vars.DEPLOY_ENABLED == 'true' && (needs.changes.outputs.coordinator == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Frontend source is the source of truth: rebuild the self-contained
      # coordinator/index.html from frontend/src so the deploy never relies on a
      # stale committed bundle.
      - name: Build frontend (single-file -> coordinator/index.html)
        run: |
          cd frontend
          npm ci
          npm run build

      # Runs after the frontend build so the asset tests have real hashed files
      # to serve. Guards the static/SPA routing and that the API is still gated.
      - name: Validate coordinator (py_compile + static route tests)
        run: |
          python3 -m py_compile coordinator/main.py
          (cd coordinator && python3 -m unittest -q tests.test_static_routes tests.test_vm_serial)

      - id: auth
        name: Authenticate to GCP (keyless / WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Cloud Run, not a Cloud Function: the container serves the multi-file
      # console (index.html + hashed assets/) AND the API from one origin, which
      # is what makes route-level code splitting possible. `--source` hands the
      # directory to Cloud Build, which uses coordinator/Dockerfile and pushes the
      # image to Artifact Registry.
      #
      # Env vars and the runtime service account are preserved by gcloud across
      # redeploys (Terraform owns them); only the non-secret service shape is
      # re-asserted here so it stays deterministic.
      - name: Deploy coordinator (Cloud Run)
        run: |
          gcloud run deploy palpilot-coordinator \
            --project="$PROJECT" \
            --region="$REGION" \
            --source=coordinator \
            --service-account="palworld-coordinator@${PROJECT}.iam.gserviceaccount.com" \
            --port=8080 \
            --memory=512Mi \
            --timeout=300s \
            --min-instances=0 \
            --max-instances=2 \
            --allow-unauthenticated \
            --quiet

      # Fails the deploy if the console didn't actually ship: the container must
      # serve the app shell at / and the hashed asset the shell references.
      - name: Smoke-test the deployed console
        run: |
          URL="$(gcloud run services describe palpilot-coordinator \
                   --project="$PROJECT" --region="$REGION" --format='value(status.url)')"
          echo "coordinator: $URL"
          code=$(curl -sS -o /tmp/index.html -w '%{http_code}' "$URL/")
          test "$code" = "200" || { echo "GET / returned $code"; exit 1; }
          asset=$(grep -oE '/assets/[A-Za-z0-9._-]+\.js' /tmp/index.html | head -1)
          test -n "$asset" || { echo "index.html references no /assets/*.js"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$URL$asset")
          test "$code" = "200" || { echo "asset $asset returned $code"; exit 1; }
          # The API must still be gated after all this.
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$URL/api/overview")
          test "$code" = "401" || { echo "/api/overview returned $code, expected 401"; exit 1; }
          echo "console + assets served, API still gated"

  deploy-panel:
    timeout-minutes: 10
    needs: [changes, ci]
    if: vars.DEPLOY_ENABLED == 'true' && (needs.changes.outputs.panel == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tests/ has no __init__.py, so `unittest discover` can't load it — list the
      # modules explicitly and add new ones here.
      - name: Validate panel (py_compile + parser/metrics/log tests)
        run: |
          python3 -m py_compile panel/panel.py panel/idle_watchdog.py
          (cd panel && python3 -m unittest -q tests.test_ini tests.test_metrics_logs tests.test_update)

      - id: auth
        name: Authenticate to GCP (keyless / WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Panel code lives in the bucket and is fetched by the VM at boot. This
      # push does NOT restart a running server; it takes effect on the next VM
      # start (or a manual "self-update"). We deliberately don't auto-restart a
      # live game server from CI.
      - name: Push panel code to bucket
        run: |
          gcloud storage cp panel/panel.py        "gs://${PANEL_BUCKET}/panel.py"
          gcloud storage cp panel/index.html       "gs://${PANEL_BUCKET}/index.html"
          gcloud storage cp panel/idle_watchdog.py "gs://${PANEL_BUCKET}/idle_watchdog.py"
