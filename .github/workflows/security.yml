name: security

# Dependency audits. Findings are reported, not fixed here.
# npm audit joins in the frontend tooling PR, together with the fix for the zod advisory
# (GHSA-mrhx-c7xc-m3w5) it reports today; that fix touches frontend/, a deploy path.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch: {}
  pull_request:
    paths:
      - coordinator/requirements.txt
      - .github/workflows/security.yml

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uvx --from pip-audit==2.10.1 pip-audit -r coordinator/requirements.txt

