name: security

# Dependency audits (pip-audit for the coordinator, npm audit for the console).
# Findings are reported, not fixed here. npm audit fails on high or critical in
# production dependencies only; dev-only findings stay out of the gate.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch: {}
  pull_request:
    paths:
      - coordinator/requirements.txt
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/security.yml

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uvx --from pip-audit==2.10.1 pip-audit -r coordinator/requirements.txt


  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 (LTS), as in ci.yml and deploy.yml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Reads package-lock.json; no install needed.
      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
